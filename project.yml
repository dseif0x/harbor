# XcodeGen project definition.
# Generate the Xcode project with:  xcodegen generate
# (CI does this automatically — see .github/workflows/ios.yml)
name: Harbor
options:
  bundleIdPrefix: id.seifert.harbor
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  # Pinned to exact versions the code is written against; SwiftTerm's API moves
  # between releases, so avoid silent major jumps.
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: "0.12.1"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: "1.99.3"

targets:
  Harbor:
    type: application
    platform: iOS
    sources:
      - path: Harbor
      - path: Shared
    info:
      path: Harbor/Info.plist
      properties:
        CFBundleDisplayName: Harbor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        UIAppFonts:
          - FiraCode-Regular.ttf
          - FiraCode-Bold.ttf
          - FiraCode-Light.ttf
        NSLocalNetworkUsageDescription: Harbor connects to SSH and SFTP servers on your local network.
        UIBackgroundModes:
          - fetch
          - processing
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.seifert.harbor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - target: HarborActivity

  HarborActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: HarborActivity
      - path: Shared
    info:
      path: HarborActivity/Info.plist
      properties:
        CFBundleDisplayName: Harbor Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.seifert.harbor.activity
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
